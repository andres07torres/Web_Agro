services:
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY:-dev_key_agro_visor_9921}
      - DATABASE_URL=${DATABASE_URL:-postgresql://cuencas_user:cuencas_pass@db:5432/cuencas_db}
      - FLASK_DEBUG=False
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/static/uploads
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=cuencas_db
      - POSTGRES_USER=cuencas_user
      - POSTGRES_PASSWORD=cuencas_pass
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cuencas_user -d cuencas_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
