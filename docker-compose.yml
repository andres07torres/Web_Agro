services:
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY:-dev_key_agro_visor_9921}
      - DATABASE_URL=${DATABASE_URL}
      - FLASK_DEBUG=False
    volumes:
      - uploads:/app/static/uploads
    restart: unless-stopped

volumes:
  uploads:
